<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 60" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FF6B4A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284C7" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Icon Emblem -->
  <g transform="translate(6, 6)" filter="url(#glow)">
    <!-- Outer ring background -->
    <circle cx="24" cy="24" r="23" fill="#0B1B3D" stroke="url(#brandGrad)" stroke-width="2"/>
    
    <!-- Sun rising over horizon -->
    <path d="M16 25 A8 8 0 0 1 32 25 Z" fill="url(#sunGrad)" opacity="0.9" />
    
    <!-- Stylized waves/island curve -->
    <path d="M10 28 C 15 24, 21 30, 27 26 C 33 22, 36 27, 38 28" stroke="url(#brandGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M12 33 C 17 30, 23 34, 29 31 C 33 29, 36 32, 37 33" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>

    <!-- Compass pointer / Arrow head pointing to exploration -->
    <polygon points="24,6 27,20 24,17 21,20" fill="url(#brandGrad)"/>
    <polygon points="24,17 27,20 24,22 21,20" fill="#0284C7" opacity="0.5"/>
  </g>

  <!-- Typography with clear separation between MORDEN and TOURIST -->
  <text y="32" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24">
    <tspan x="68" font-weight="800" letter-spacing="1" fill="#0B1B3D">MORDEN</tspan>
    <tspan dx="16" font-weight="700" letter-spacing="2" fill="#0D9488">TOURIST</tspan>
  </text>

  <!-- Subtitle Tagline with non-overlapping dot -->
  <text x="69" y="47" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="8" letter-spacing="2.6" fill="#64748B">
    PREMIUM TRAVEL &amp; DESTINATIONS <tspan fill="#FF6B4A" font-size="10" font-weight="900">&#x2022;</tspan>
  </text>
</svg>
