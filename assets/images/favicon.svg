<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1B3D" />
      <stop offset="100%" stop-color="#0F2B5C" />
    </linearGradient>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>
    <linearGradient id="favSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FF6B4A" />
    </linearGradient>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect width="64" height="64" rx="16" fill="url(#favBg)"/>
  
  <!-- Outer glowing accent ring -->
  <circle cx="32" cy="32" r="25" stroke="url(#favGrad)" stroke-width="2.5" opacity="0.6"/>

  <!-- Rising Sun -->
  <path d="M22 33 A10 10 0 0 1 42 33 Z" fill="url(#favSun)"/>

  <!-- Tropical Island / Wave lines -->
  <path d="M14 37 C 20 32, 28 40, 36 35 C 44 30, 48 36, 50 38" stroke="url(#favGrad)" stroke-width="3" stroke-linecap="round"/>
  <path d="M17 44 C 23 40, 31 46, 39 42 C 45 39, 48 43, 49 44" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" opacity="0.8"/>

  <!-- Compass Star Needle pointing North -->
  <polygon points="32,9 36,26 32,23 28,26" fill="url(#favGrad)"/>
  <polygon points="32,23 36,26 32,28 28,26" fill="#0EA5E9" opacity="0.6"/>
</svg>
